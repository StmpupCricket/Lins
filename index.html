<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sony TEN 2 HD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      background: black;
    }
  </style>
</head>
<body>
  <video id="player" playsinline controls autoplay></video>

  <script>
    const video = document.getElementById('player');
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource('https://tataplay.slivcdn.com/hls/live/2020591/TEN3HD/master_3500.m3u8');
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = 'https://tataplay.slivcdn.com/hls/live/2020591/TEN3HD/master_3500.m3u8';
      video.addEventListener('loadedmetadata', () => {
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      });
    }

    const player = new Plyr(video);

    // Attempt to unmute on interaction
    ['click', 'touchstart', 'keydown'].forEach(evt =>
      document.addEventListener(evt, () => {
        video.muted = false;
        video.volume = 0.8;
      }, { once: true })
    );
  </script>
</body>
</html>
